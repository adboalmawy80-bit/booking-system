<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المتجر الذكي برو - قالب e-Commerce متكامل</title>

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text: #0f172a;
            --muted: #64748b;
            --accent: #10b981;
            --danger: #ef4444;
            --border: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            --radius: 16px;
        }

        body.dark-mode {
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.9);
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #334155;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; transition: background 0.3s, color 0.3s; }
        body { background: var(--bg); color: var(--text); padding-bottom: 60px; min-height: 100vh; position: relative; }

        /* خلفية جمالية ممتدة للقالب */
        .glow-1 { position: fixed; top: -100px; right: -100px; width: 450px; height: 450px; background: radial-gradient(circle, rgba(37,99,235,0.15) 0%, transparent 70%); pointer-events: none; }
        .glow-2 { position: fixed; bottom: -100px; left: -100px; width: 450px; height: 450px; background: radial-gradient(circle, rgba(16,185,129,0.15) 0%, transparent 70%); pointer-events: none; }

        /* Navbar Nav */
        nav { background: #0f172a; padding: 16px 30px; display: flex; justify-content: space-between; align-items: center; color: white; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        nav h1 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .nav-btns { display: flex; gap: 10px; align-items: center; }
        .nav-btns button { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .nav-btns button:hover { background: var(--primary); }
        .btn-theme { background: #334155 !important; border: none !important; font-size: 16px; padding: 8px 12px !important; }

        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        .hidden { display: none !important; }

        /* Controls: Search & Sort */
        .controls-bar { display: flex; gap: 15px; margin: 20px 0; background: var(--card-bg); backdrop-filter: blur(8px); padding: 15px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); }
        
        /* Grid */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 20px; }
        .product-card { background: var(--card-bg); border-radius: var(--radius); padding: 15px; border: 1px solid var(--border); box-shadow: var(--shadow); text-align: center; position: relative; transition: transform 0.2s; }
        .product-card:hover { transform: translateY(-4px); }
        .product-card img { width: 100%; height: 180px; object-fit: cover; border-radius: 10px; }
        .product-card h3 { font-size: 17px; margin: 10px 0 5px; }
        .product-card .price { font-weight: bold; color: var(--primary); font-size: 16px; margin-bottom: 10px; }
        .btn-add { background: var(--primary); color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-add:hover { background: var(--primary-dark); }
        
        .badge-stock { position: absolute; top: 25px; right: 25px; background: var(--danger); color: white; font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 12px; }

        /* Cart */
        .cart-box { background: var(--card-bg); border-radius: var(--radius); border: 1px solid var(--border); padding: 20px; margin-top: 30px; box-shadow: var(--shadow); }
        .btn-checkout { background: var(--accent); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 15px; }

        /* Admin & Cards */
        .card { background: var(--card-bg); padding: 30px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); max-width: 600px; margin: 40px auto; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: var(--card-bg); color: var(--text); outline: none; }
        .btn-main { width: 100%; padding: 10px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; }
        .admin-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding: 10px 0; }
        .btn-del { background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        /* Analytics KPI Cards */
        .analytics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin: 20px 0; }
        .kpi-card { background: rgba(0,0,0,0.03); padding: 15px; border-radius: 10px; border: 1px solid var(--border); }
        body.dark-mode .kpi-card { background: rgba(255,255,255,0.05); }
        .kpi-card h4 { font-size: 12px; color: var(--muted); margin-bottom: 5px; }
        .kpi-card .val { font-size: 18px; font-weight: 800; color: var(--primary); }
    </style>
</head>
<body>

    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <nav>
        <h1>🛍️ المتجر الذكي برو</h1>
        <div class="nav-btns">
            <button onclick="switchTab('store')">الواجهة (المتجر)</button>
            <button onclick="switchTab('admin')">لوحة التحكم</button>
            <button class="btn-theme" onclick="toggleDarkMode()" id="themeBtn">🌙</button>
        </div>
    </nav>

    <div class="container">

        <!-- 1. واجهة المتجر الرئيسية -->
        <div id="storeView">
            <h2>✨ التشكيلة المميزة</h2>

            <div class="controls-bar">
                <input type="text" id="searchInput" oninput="filterProducts()" placeholder="🔍 ابحث عن عطر...">
                <select id="sortSelect" onchange="filterProducts()">
                    <option value="default">الترتيب الافتراضي</option>
                    <option value="low-high">السعر: من الأقل إلى الأعلى</option>
                    <option value="high-low">السعر: من الأعلى إلى الأقل</option>
                </select>
            </div>

            <div id="productsContainer" class="products-grid"></div>

            <div class="cart-box">
                <h3>🛒 سلة الشراء</h3>
                <div id="cartItems" style="margin: 15px 0;">السلة فارغة حالياً.</div>
                <h4>الإجمالي: <span id="cartTotal">0</span> ج.م</h4>
                <button class="btn-checkout" onclick="checkout()">تأكيد الشراء والطلب 💳</button>
            </div>
        </div>

        <!-- 2. شاشة تسجيل دخول الأدمن -->
        <div id="adminLoginView" class="card hidden">
            <h2 style="text-align: center; margin-bottom: 15px;">🔐 تسجيل دخول الأدمن</h2>
            <input type="text" id="adminUser" placeholder="اسم المستخدم (admin)">
            <input type="password" id="adminPass" placeholder="كلمة السر (123456)">
            <button class="btn-main" onclick="adminLogin()">دخول اللوحة</button>
            <p id="loginErr" style="color: red; text-align: center; margin-top: 10px;"></p>
        </div>

        <!-- 3. لوحة تحكم الأدمن -->
        <div id="adminDashboardView" class="card hidden" style="max-width: 800px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>🛠️ لوحة تحكم القالب</h2>
                <button onclick="adminLogout()" style="background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer;">خروج</button>
            </div>
            <hr style="margin: 15px 0; border: none; border-top: 1px solid var(--border);">

            <!-- كروت الإحصائيات -->
            <div class="analytics-grid">
                <div class="kpi-card">
                    <h4>💰 إجمالي الأرباح</h4>
                    <div class="val" id="kpiRevenue">0 ج.م</div>
                </div>
                <div class="kpi-card">
                    <h4>📦 الطلبات الناجحة</h4>
                    <div class="val" id="kpiOrders">0</div>
                </div>
                <div class="kpi-card">
                    <h4>🔥 الأكثر مبيعاً</h4>
                    <div class="val" id="kpiTop" style="font-size: 14px;">-</div>
                </div>
            </div>

            <h3 style="margin-top: 20px;">إضافة منتج جديد</h3>
            <input type="text" id="pName" placeholder="اسم العطر">
            <input type="number" id="pPrice" placeholder="السعر (ج.م)">
            <input type="number" id="pStock" placeholder="المخزون المتوفر" value="10">
            <input type="text" id="pImg" placeholder="رابط صورة المنتج">
            <button class="btn-main" style="background: #10b981;" onclick="addProduct()">حفظ وإضافة للمتجر</button>

            <h3 style="margin-top: 30px;">إدارة المنتجات الحالية</h3>
            <div id="adminProductsList" style="margin-top: 10px;"></div>
        </div>

    </div>

    <script>
        let cart = [];
        let allProducts = [];

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('themeBtn').innerText = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            document.getElementById('themeBtn').innerText = '☀️';
        }

        function switchTab(tab) {
            if (tab === 'store') {
                document.getElementById('storeView').classList.remove('hidden');
                document.getElementById('adminLoginView').classList.add('hidden');
                document.getElementById('adminDashboardView').classList.add('hidden');
                loadStoreProducts();
            } else if (tab === 'admin') {
                document.getElementById('storeView').classList.add('hidden');
                if (localStorage.getItem('adminToken')) {
                    document.getElementById('adminLoginView').classList.add('hidden');
                    document.getElementById('adminDashboardView').classList.remove('hidden');
                    loadAnalytics();
                } else {
                    document.getElementById('adminLoginView').classList.remove('hidden');
                    document.getElementById('adminDashboardView').classList.add('hidden');
                }
            }
        }

        async function loadStoreProducts() {
            try {
                const res = await fetch('/api/products');
                allProducts = await res.json();
                renderProducts(allProducts);
            } catch (e) {
                console.error("خطأ في جلب البيانات", e);
            }
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const sort = document.getElementById('sortSelect').value;

            let filtered = allProducts.filter(p => p.name.toLowerCase().includes(query));

            if (sort === 'low-high') filtered.sort((a, b) => a.price - b.price);
            if (sort === 'high-low') filtered.sort((a, b) => b.price - a.price);

            renderProducts(filtered);
        }

        function renderProducts(productsList) {
            const container = document.getElementById('productsContainer');
            container.innerHTML = '';

            productsList.forEach(p => {
                const isLow = p.stock && p.stock <= 3;
                const badge = isLow ? `<div class="badge-stock">متبقي ${p.stock} فقط!</div>` : '';

                container.innerHTML += `
                    <div class="product-card">
                        ${badge}
                        <img src="${p.image}" alt="${p.name}">
                        <h3>${p.name}</h3>
                        <div class="price">${p.price} ج.م</div>
                        <button class="btn-add" onclick="addToCart('${p.id}')">إضافة للسلة 🛒</button>
                    </div>
                `;
            });
        }

        function addToCart(id) {
            const product = allProducts.find(p => p.id === id);
            const exist = cart.find(item => item.id === id);
            if (exist) {
                exist.qty++;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cartItems');
            if (cart.length === 0) {
                container.innerHTML = 'السلة فارغة حالياً.';
                document.getElementById('cartTotal').innerText = '0';
                return;
            }

            container.innerHTML = '';
            let total = 0;
            cart.forEach(item => {
                total += item.price * item.qty;
                container.innerHTML += `
                    <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                        <span>${item.name} (${item.qty})</span>
                        <span>${item.price * item.qty} ج.م</span>
                    </div>
                `;
            });
            document.getElementById('cartTotal').innerText = total;
        }

        // تأكيد الشراء (محاكاة وهمية ناجحة)
        async function checkout() {
            if (cart.length === 0) return alert('السلة فارغة!');
            const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);

            const res = await fetch('/api/checkout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ items: cart, total: total })
            });

            const data = await res.json();
            if (data.success) {
                alert(`🎉 ${data.message}\nرقم الطلب: ${data.orderId}\n(راجع الترمينال لرؤية تفاصيل الطلب المطبوع!)`);
                cart = [];
                renderCart();
                loadStoreProducts();
            }
        }

        async function adminLogin() {
            const username = document.getElementById('adminUser').value;
            const password = document.getElementById('adminPass').value;

            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (data.success) {
                localStorage.setItem('adminToken', data.token);
                switchTab('admin');
            } else {
                document.getElementById('loginErr').innerText = data.message;
            }
        }

        function adminLogout() {
            localStorage.removeItem('adminToken');
            switchTab('admin');
        }

        async function loadAnalytics() {
            try {
                const res = await fetch('/api/admin/analytics');
                const data = await res.json();

                document.getElementById('kpiRevenue').innerText = (data.totalRevenue || 0) + ' ج.م';
                document.getElementById('kpiOrders').innerText = data.totalOrders || 0;
                document.getElementById('kpiTop').innerText = data.topSelling && data.topSelling.sold > 0 
                    ? `${data.topSelling.name} (${data.topSelling.sold})` 
                    : '-';
            } catch (e) {
                console.log("Analytics Error");
            }
            loadAdminProducts();
        }

        async function loadAdminProducts() {
            const res = await fetch('/api/products');
            const products = await res.json();
            const list = document.getElementById('adminProductsList');
            list.innerHTML = '';
            products.forEach(p => {
                list.innerHTML += `
                    <div class="admin-item">
                        <div><strong>${p.name}</strong> - ${p.price} ج.م | (المخزون: ${p.stock || 0})</div>
                        <button class="btn-del" onclick="deleteProduct('${p.id}')">حذف</button>
                    </div>
                `;
            });
        }

        async function addProduct() {
            const name = document.getElementById('pName').value;
            const price = document.getElementById('pPrice').value;
            const stock = document.getElementById('pStock').value;
            const image = document.getElementById('pImg').value;

            if(!name || !price) return alert('برجاء كتابة الاسم والسعر');

            await fetch('/api/admin/products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, price, stock, image })
            });

            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pStock').value = '10';
            document.getElementById('pImg').value = '';
            loadAnalytics();
        }

        async function deleteProduct(id) {
            if(confirm('هل تريد حذف هذا المنتج؟')) {
                await fetch('/api/admin/products/' + id, { method: 'DELETE' });
                loadAnalytics();
            }
        }

        loadStoreProducts();
    </script>
</body>
</html>
